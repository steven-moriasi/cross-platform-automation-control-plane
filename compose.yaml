name: cross-platform-automation-control-plane

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-automation_control_plane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-automation-local-only}
      POSTGRES_USER: ${POSTGRES_USER:-automation}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-automation} -d
          ${POSTGRES_DB:-automation_control_plane}",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "5438:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-only
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HOSTNAME: http://localhost:8089
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET
          /realms/automation-control-plane HTTP/1.1\\r\\nHost:
          localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q
          '200 OK'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    ports:
      - "8089:8080"
    volumes:
      - ./deploy/local/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro

  control-plane-migrate:
    build:
      context: .
      dockerfile: services/control-plane/Dockerfile
    command: ["node", "dist/database/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-automation}:${POSTGRES_PASSWORD:-automation-local-only}@postgres:5432/${POSTGRES_DB:-automation_control_plane}
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
    restart: "no"

  control-plane-api:
    build:
      context: .
      dockerfile: services/control-plane/Dockerfile
    depends_on:
      control-plane-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      CATALOG_REPOSITORY_ROOT: /app
      DATABASE_URL: postgres://${POSTGRES_USER:-automation}:${POSTGRES_PASSWORD:-automation-local-only}@postgres:5432/${POSTGRES_DB:-automation_control_plane}
      OIDC_AUDIENCE: control-plane-api
      OIDC_ISSUER: http://localhost:8089/realms/automation-control-plane
      OIDC_JWKS_URL: http://keycloak:8080/realms/automation-control-plane/protocol/openid-connect/certs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PORT: 4000
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
      TELEMETRY_CLIENT_ID: ${TELEMETRY_CLIENT_ID:-local-automation-packages}
      TELEMETRY_SIGNING_SECRET: ${TELEMETRY_SIGNING_SECRET:-local-telemetry-signing-secret-change-me}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "4000:4000"
    restart: unless-stopped

  control-plane-worker:
    build:
      context: .
      dockerfile: services/control-plane/Dockerfile
    command: ["node", "dist/worker.js"]
    depends_on:
      control-plane-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-automation}:${POSTGRES_PASSWORD:-automation-local-only}@postgres:5432/${POSTGRES_DB:-automation_control_plane}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
    restart: unless-stopped

  synthetic-operations-api:
    build:
      context: .
      dockerfile: services/synthetic-operations-api/Dockerfile
    environment:
      PORT: 4100
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
      SYNTHETIC_CALLBACK_SECRET: ${SYNTHETIC_CALLBACK_SECRET:-local-synthetic-callback-secret-change-me}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4100/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "4100:4100"
    restart: unless-stopped

  n8n-volume-init:
    image: alpine:3.22.1
    command: ["chown", "-R", "1000:1000", "/data"]
    restart: "no"
    volumes:
      - n8n-data:/data

  n8n-import:
    build:
      context: .
      dockerfile: automations/n8n/Dockerfile
    entrypoint: ["/bin/sh", "/workflows/import.sh"]
    depends_on:
      control-plane-api:
        condition: service_healthy
      n8n-volume-init:
        condition: service_completed_successfully
      synthetic-operations-api:
        condition: service_healthy
    environment:
      N8N_CUSTOM_EXTENSIONS: /home/node/.n8n/custom
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-n8n-encryption-key-change-me}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_USER_FOLDER: /home/node/n8n-data
      TELEMETRY_CLIENT_ID: ${TELEMETRY_CLIENT_ID:-local-automation-packages}
      TELEMETRY_SIGNING_SECRET: ${TELEMETRY_SIGNING_SECRET:-local-telemetry-signing-secret-change-me}
    restart: "no"
    volumes:
      - ./automations/n8n/claims-intake:/workflows:ro
      - n8n-data:/home/node/n8n-data

  n8n:
    build:
      context: .
      dockerfile: automations/n8n/Dockerfile
    depends_on:
      n8n-import:
        condition: service_completed_successfully
    environment:
      GENERIC_TIMEZONE: Africa/Nairobi
      N8N_CUSTOM_EXTENSIONS: /home/node/.n8n/custom
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-n8n-encryption-key-change-me}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_HOST: localhost
      N8N_METRICS: "true"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_PYTHON_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "true"
      N8N_USER_FOLDER: /home/node/n8n-data
      TELEMETRY_CLIENT_ID: ${TELEMETRY_CLIENT_ID:-local-automation-packages}
      TELEMETRY_SIGNING_SECRET: ${TELEMETRY_SIGNING_SECRET:-local-telemetry-signing-secret-change-me}
      TZ: Africa/Nairobi
      N8N_WEBHOOK_URL: http://localhost:5678/
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5678/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "5678:5678"
    restart: unless-stopped
    volumes:
      - n8n-data:/home/node/n8n-data

  tempo:
    image: grafana/tempo@sha256:0ef775495967cd5d7a6b2e146b6ea695d624803c8db8349fb8ce4164f719f9b7
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "127.0.0.1:3200:3200"
    restart: unless-stopped
    volumes:
      - ./ops/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  otel-collector:
    image: otel/opentelemetry-collector-contrib@sha256:89107a3a8f4636a396927edf7025bb9614b8da2d92f4cc3f43109e8d115736e2
    command: ["--config=/etc/otel-collector.yaml"]
    depends_on:
      - tempo
    restart: unless-stopped
    volumes:
      - ./ops/observability/otel-collector.yaml:/etc/otel-collector.yaml:ro

  prometheus:
    image: prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    depends_on:
      control-plane-api:
        condition: service_healthy
      synthetic-operations-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    volumes:
      - ./ops/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./ops/observability/alerts.yaml:/etc/prometheus/rules/alerts.yaml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    depends_on:
      - prometheus
      - tempo
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      control-plane-api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      synthetic-operations-api:
        condition: service_healthy
    environment:
      CONTROL_PLANE_INTERNAL_URL: http://control-plane-api:4000
      OIDC_CLIENT_ID: automation-control-plane-web
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-automation-control-plane-local-client-secret}
      OIDC_INTERNAL_BASE_URL: http://keycloak:8080
      OIDC_PUBLIC_ISSUER: http://localhost:8089/realms/automation-control-plane
      SESSION_SECRET: ${SESSION_SECRET:-automation-control-plane-local-session-secret-change-me}
      WEB_BASE_URL: http://localhost:${WEB_PORT:-3000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  grafana-data:
  n8n-data:
  postgres-data:
  prometheus-data:
  tempo-data:
