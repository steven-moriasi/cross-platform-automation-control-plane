name: cross-platform-automation-control-plane

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-automation_control_plane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-automation-local-only}
      POSTGRES_USER: ${POSTGRES_USER:-automation}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-automation} -d
          ${POSTGRES_DB:-automation_control_plane}",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "5438:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-only
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HOSTNAME: http://localhost:8089
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET
          /realms/automation-control-plane HTTP/1.1\\r\\nHost:
          localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q
          '200 OK'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    ports:
      - "8089:8080"
    volumes:
      - ./deploy/local/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro

  control-plane-migrate:
    build:
      context: .
      dockerfile: services/control-plane/Dockerfile
    command: ["node", "dist/database/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-automation}:${POSTGRES_PASSWORD:-automation-local-only}@postgres:5432/${POSTGRES_DB:-automation_control_plane}
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
    restart: "no"

  control-plane-api:
    build:
      context: .
      dockerfile: services/control-plane/Dockerfile
    depends_on:
      control-plane-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-automation}:${POSTGRES_PASSWORD:-automation-local-only}@postgres:5432/${POSTGRES_DB:-automation_control_plane}
      OIDC_AUDIENCE: control-plane-api
      OIDC_ISSUER: http://localhost:8089/realms/automation-control-plane
      OIDC_JWKS_URL: http://keycloak:8080/realms/automation-control-plane/protocol/openid-connect/certs
      PORT: 4000
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "4000:4000"
    restart: unless-stopped

  control-plane-worker:
    build:
      context: .
      dockerfile: services/control-plane/Dockerfile
    command: ["node", "dist/worker.js"]
    depends_on:
      control-plane-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-automation}:${POSTGRES_PASSWORD:-automation-local-only}@postgres:5432/${POSTGRES_DB:-automation_control_plane}
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
    restart: unless-stopped

  synthetic-operations-api:
    build:
      context: .
      dockerfile: services/synthetic-operations-api/Dockerfile
    environment:
      PORT: 4100
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4100/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "4100:4100"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      control-plane-api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      synthetic-operations-api:
        condition: service_healthy
    environment:
      CONTROL_PLANE_INTERNAL_URL: http://control-plane-api:4000
      OIDC_CLIENT_ID: automation-control-plane-web
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-automation-control-plane-local-client-secret}
      OIDC_INTERNAL_BASE_URL: http://keycloak:8080
      OIDC_PUBLIC_ISSUER: http://localhost:8089/realms/automation-control-plane
      SESSION_SECRET: ${SESSION_SECRET:-automation-control-plane-local-session-secret-change-me}
      WEB_BASE_URL: http://localhost:${WEB_PORT:-3000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  postgres-data:
