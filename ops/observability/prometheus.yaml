global:
  evaluation_interval: 15s
  scrape_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: control-plane-api
    metrics_path: /metrics
    static_configs:
      - targets: ["control-plane-api:4000"]

  - job_name: synthetic-operations-api
    metrics_path: /metrics
    static_configs:
      - targets: ["synthetic-operations-api:4100"]

  - job_name: n8n
    metrics_path: /metrics
    static_configs:
      - targets: ["n8n:5678"]
