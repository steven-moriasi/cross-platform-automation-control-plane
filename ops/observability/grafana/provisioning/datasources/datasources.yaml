apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    uid: prometheus

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      httpMethod: GET
      tracesToMetrics:
        datasourceUid: prometheus
        spanEndTimeShift: 1h
        spanStartTimeShift: -1h
        tags:
          - key: service.name
            value: service
      serviceMap:
        datasourceUid: prometheus
    uid: tempo
