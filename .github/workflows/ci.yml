name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.23.2
  PNPM_VERSION: 12.4.1

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run repository checks
        run: pnpm check
      - name: Check secret safety
        run: pnpm security:secrets
      - name: Check patch whitespace
        run: git diff --check

  artifacts:
    name: Deployment and platform artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate release artifacts
        run: pnpm artifacts:validate
      - name: Upload artifact evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: validated-platform-artifacts-${{ github.sha }}
          path: |
            .data/release-artifacts/
            automations/power-platform/field-inspection/dist/FieldInspectionAutomation.zip
            automations/zapier/partner-onboarding/build/
          if-no-files-found: error
          retention-days: 14

  containers:
    name: Build and scan ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LOCAL_IMAGE: >-
        local/automation-control-plane-${{ matrix.name }}:${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: services/control-plane/Dockerfile
          - name: synthetic-api
            dockerfile: services/synthetic-operations-api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Create vulnerability report
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: json
          output: trivy-${{ matrix.name }}.json
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Enforce vulnerability policy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: trivy-${{ matrix.name }}-${{ github.sha }}
          path: trivy-${{ matrix.name }}.json
          if-no-files-found: warn
          retention-days: 14
