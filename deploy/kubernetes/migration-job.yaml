apiVersion: batch/v1
kind: Job
metadata:
  name: control-plane-migrate
  labels:
    app.kubernetes.io/component: migration
    app.kubernetes.io/name: control-plane
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migration
        app.kubernetes.io/name: control-plane
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: control-plane
      containers:
        - name: migration
          image: ghcr.io/steven-moriasi/automation-control-plane-api:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/database/migrate.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: control-plane-runtime
                  key: database-url
          envFrom:
            - configMapRef:
                name: control-plane-configuration
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 64Mi
