apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: automation-control-plane
resources:
  - namespace.yaml
  - service-account.yaml
  - configuration.yaml
  - migration-job.yaml
  - control-plane-api.yaml
  - control-plane-worker.yaml
  - synthetic-operations-api.yaml
  - web.yaml
  - ingress.yaml
  - autoscaling.yaml
  - disruption-budgets.yaml
  - network-policies.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: automation-control-plane
    includeSelectors: true
    includeTemplates: true
images:
  - name: ghcr.io/steven-moriasi/automation-control-plane-api
    newTag: 0.1.0
  - name: ghcr.io/steven-moriasi/automation-control-plane-synthetic-api
    newTag: 0.1.0
  - name: ghcr.io/steven-moriasi/automation-control-plane-web
    newTag: 0.1.0
